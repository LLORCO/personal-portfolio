<!doctype html>
<!--
  Fuente del Open Graph image (public/og-image.png), 1200x630.
  Regenerar con Chrome headless desde la raíz del repo:

  google-chrome --headless=new --disable-gpu --hide-scrollbars \
    --force-device-scale-factor=1 --virtual-time-budget=8000 \
    --window-size=1200,630 --screenshot=public/og-image.png \
    scripts/og-image.html

  Requiere red para las fuentes de Google (Archivo / Space Grotesk),
  las mismas que carga el sitio en src/styles.css.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: "Space Grotesk", sans-serif;
        color: #ffffff;
        background: linear-gradient(135deg, #047857 0%, #065f46 42%, #052e16 100%);
      }

      .canvas {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 68px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }

      .glow {
        position: absolute;
        border-radius: 9999px;
        filter: blur(90px);
        pointer-events: none;
      }

      .glow--accent {
        top: -180px;
        right: -120px;
        width: 520px;
        height: 520px;
        background: rgba(52, 211, 153, 0.35);
      }

      .glow--lime {
        bottom: -220px;
        left: -140px;
        width: 460px;
        height: 460px;
        background: rgba(163, 230, 53, 0.16);
      }

      .top {
        position: relative;
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .mark {
        width: 76px;
        height: 76px;
        border-radius: 18px;
      }

      .eyebrow {
        font-family: "Archivo", sans-serif;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #bbf7d0;
      }

      .main {
        position: relative;
      }

      h1 {
        font-family: "Archivo", sans-serif;
        font-weight: 800;
        font-size: 92px;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .role {
        margin-top: 22px;
        font-family: "Archivo", sans-serif;
        font-weight: 600;
        font-size: 46px;
        line-height: 1.1;
        color: #6ee7b7;
      }

      .summary {
        margin-top: 22px;
        max-width: 860px;
        font-size: 24px;
        line-height: 1.45;
        color: rgba(220, 252, 231, 0.92);
      }

      .bottom {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding-top: 26px;
        border-top: 1px solid rgba(167, 243, 208, 0.3);
      }

      .chips {
        display: flex;
        gap: 10px;
      }

      .chip {
        font-family: "Archivo", sans-serif;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #dcfce7;
        border: 1px solid rgba(167, 243, 208, 0.45);
        border-radius: 8px;
        padding: 8px 14px;
      }

      .url {
        font-family: "Archivo", sans-serif;
        font-weight: 600;
        font-size: 22px;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="glow glow--accent"></div>
      <div class="glow glow--lime"></div>

      <div class="top">
        <img class="mark" src="../public/favicon.svg" alt="" />
        <p class="eyebrow">Shopify / Frontend / Full Stack</p>
      </div>

      <div class="main">
        <h1>Jorge Hernández</h1>
        <p class="role">Shopify Front-End Developer</p>
        <p class="summary">
          Ecommerce e interfaces accesibles — Shopify, React y accesibilidad WCAG desde Puebla, México.
        </p>
      </div>

      <div class="bottom">
        <div class="chips">
          <span class="chip">Ecommerce</span>
          <span class="chip">A11y</span>
          <span class="chip">Creative dev</span>
        </div>
        <p class="url">jorgehdz.vercel.app</p>
      </div>
    </div>
  </body>
</html>
