<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio de Jorge Hernández: full stack frontend, Shopify ecommerce, accesibilidad WCAG y community builder en Puebla, México."
    />
    <title>Jorge Hernández — Creative dev · Ecommerce · Accessibility</title>
    <script>
      (function () {
        var storedTheme = localStorage.getItem("portfolio-theme");
        var dark =
          storedTheme === "dark" ||
          (storedTheme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        if (dark) {
          root.classList.add("dark");
          root.style.colorScheme = "dark";
        } else {
          root.classList.remove("dark");
          root.style.colorScheme = "light";
        }

        var storedLocale = localStorage.getItem("portfolio-locale");
        if (storedLocale === "es" || storedLocale === "en") {
          root.lang = storedLocale;
        }
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-stone-800 dark:bg-stone-950 dark:text-stone-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
