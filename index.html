    <script>
      (function () {
        var storedTheme = localStorage.getItem("portfolio-theme");
        var dark =
          storedTheme === "dark" ||
          (storedTheme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        if (dark) {
          root.classList.add("dark");
          root.style.colorScheme = "dark";
        } else {
          root.classList.remove("dark");
          root.style.colorScheme = "light";
        }

        var storedLocale = localStorage.getItem("portfolio-locale");
        if (storedLocale === "es" || storedLocale === "en") {
          root.lang = storedLocale;
        }
      })();
    </script>

  <body class="bg-stone-50 text-stone-800 dark:bg-stone-950 dark:text-stone-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
