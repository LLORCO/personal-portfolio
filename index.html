    <script>
      (function () {
        var storedTheme = localStorage.getItem("portfolio-theme");
        var dark =
          storedTheme === "dark" ||
          (storedTheme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        if (dark) {
          root.classList.add("dark");
          root.style.colorScheme = "dark";
        } else {
          root.classList.remove("dark");
          root.style.colorScheme = "light";
        }

        var storedLocale = localStorage.getItem("portfolio-locale");
        if (storedLocale === "es" || storedLocale === "en") {
          root.lang = storedLocale;
        }
      })();
    </script>
